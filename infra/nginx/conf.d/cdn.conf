# cdn.example.com — public delivery of the tracking SDK.
#
# The SDK is served from a domain of its own, separate from the dashboard, for three reasons:
#
#   1. It is loaded by every page of every customer site, so it must stay available even while
#      the dashboard is being deployed, restarted or is failing.
#   2. It is static. Serving it from nginx directly means no Node process is in the request
#      path for the highest-volume asset in the system.
#   3. A cookie-less origin: the dashboard's session cookies are scoped to app.example.com and
#      are never sent with an SDK request, which keeps them off customer sites entirely.
#
# The files come from a volume that the SDK build writes into — see docs/SDK-DEPLOYMENT.md.

server {
    listen 80;
    listen [::]:80;
    server_name cdn.example.com;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.example.com;

    ssl_certificate     /etc/letsencrypt/live/cdn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/sdk;

    # Nothing here is generated per request, and nothing is user-specific.
    add_header X-Content-Type-Options "nosniff" always;
    # No Strict-Transport-Security preload here: this host serves third-party sites, and a
    # long max-age on a CDN domain is a commitment that is painful to undo.

    gzip on;
    gzip_types application/javascript application/json;
    gzip_min_length 256;
    # Pre-compressed .br / .gz files, if the build produced them, avoid recompressing on every
    # request. Requires the brotli module; harmless when it is absent.
    gzip_static on;

    # The moving pointer customers install. Short cache, because this is the URL that must be
    # able to pick up a fix: a bad bundle stuck in browser caches for a year is unrecoverable.
    location = /sdk.js {
        try_files /v1/sdk.js =404;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Versioned artifacts. The path contains the version, so the bytes never change and the
    # response can be cached permanently.
    location ^~ /v1/ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Source maps are useful for debugging a customer's install and contain no secret — the
    # bundle is public. Served, but never cached as aggressively as the code.
    location ~* \.map$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        return 404;
    }
}
