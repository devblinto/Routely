# app.example.com — the dashboard and API.
#
# Everything here is dynamic and session-bearing, so it is proxied to the Next.js container
# and never cached at the edge.

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Event batches from the SDK are small; anything larger is not a request we want to serve.
    client_max_body_size 256k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;

        # Auth.js builds OAuth callback URLs from the forwarded host, and `trustHost` is
        # enabled for exactly this proxy. AUTH_URL pins the canonical origin so a forged Host
        # header cannot redirect the callback elsewhere — the two settings are only safe
        # together. See docs/AUTH.md.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_read_timeout 60s;
    }
}
