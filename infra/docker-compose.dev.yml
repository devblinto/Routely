# Local development dependencies only.
#
# The Next.js app runs on the host (`npm run dev`); this file provides just the database it
# needs. The production stack — web, nginx, certbot — arrives in Part 7 as docker-compose.yml.
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#   docker compose -f infra/docker-compose.dev.yml down          # keeps data
#   docker compose -f infra/docker-compose.dev.yml down -v       # destroys data

name: routely-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routely}
      POSTGRES_DB: ${POSTGRES_DB:-routely}
    ports:
      # Published on the host so the Prisma CLI and `next dev` can reach it. The production
      # compose file deliberately does not publish this port.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routely} -d ${POSTGRES_DB:-routely}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
